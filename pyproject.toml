[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoserve-engine"
version = "0.1.0"
description = "An educational LLM inference engine with explicit KV memory management"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
  "torch==2.13.0",
  "transformers==4.57.6",
  "safetensors==0.6.2",
]
test = [
  "torch==2.13.0",
  "transformers==4.57.6",
  "safetensors==0.6.2",
  "pytest==8.4.2",
]

[project.scripts]
nanoserve = "nanoserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
