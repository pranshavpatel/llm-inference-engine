[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoserve-engine"
version = "0.1.0"
description = "An educational LLM inference engine with explicit KV memory management"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nanoserve = "nanoserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
