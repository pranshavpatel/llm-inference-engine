name: CPU tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/cpu-test.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements/cpu-test.txt
      - name: Run CPU tests
        run: python -m pytest -q -m "not gpu"
        env:
          PYTHONPATH: src
